[package]
edition = "2021"
name = "rln"
version = "3.0.0"
build = false
exclude = ["resources/tree_depth_10/"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "APIs to manage, compute and verify zkSNARK proofs and RLN primitives"
homepage = "https://vac.dev"
documentation = "https://github.com/vacp2p/zerokit"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vacp2p/zerokit"

[package.metadata.docs.rs]
all-features = true

[features]
# EpixNet patch: default drops `parallel` (no rayon; the workspace uses
# spawn_blocking) and the sled-backed persistent tree is gated behind `stateful`.
# `sled` links native zstd, which collides with arti's async-compression zstd;
# we only need the stateless verifier + our own membership tree, so sled/pmtree
# and the C FFI are opt-in and stay out of the node build.
default = []
stateful = ["dep:sled", "dep:pmtree"]
ffi = ["stateful", "dep:safer-ffi"]
headers = ["ffi", "safer-ffi/headers"]
parallel = [
    "rayon",
    "pmtree?/parallel",
    "ark-ff/parallel",
    "ark-ec/parallel",
    "ark-std/parallel",
    "ark-poly/parallel",
    "ark-groth16/parallel",
    "ark-serialize/parallel",
    "zerokit_utils/parallel",
]

[lib]
name = "rln"
crate-type = [
    "rlib",
    "staticlib",
    "cdylib",
]
path = "src/lib.rs"
doctest = false
bench = false

[[bin]]
name = "generate_headers"
path = "src/bin/generate_headers.rs"
required-features = ["headers"]

[[test]]
name = "ffi_rln"
path = "tests/ffi_rln.rs"

[[test]]
name = "ffi_utils"
path = "tests/ffi_utils.rs"

[[test]]
name = "keygen"
path = "tests/keygen.rs"

[[test]]
name = "partial_proof"
path = "tests/partial_proof.rs"

[[test]]
name = "pm_tree"
path = "tests/pm_tree.rs"

[[test]]
name = "proof"
path = "tests/proof.rs"

[[test]]
name = "public"
path = "tests/public.rs"

[[test]]
name = "serialize"
path = "tests/serialize.rs"

[[test]]
name = "witness"
path = "tests/witness.rs"

[[bench]]
name = "generate_proof_benchmark"
path = "benches/generate_proof_benchmark.rs"
harness = false

[[bench]]
name = "pm_tree_benchmark"
path = "benches/pm_tree_benchmark.rs"
harness = false

