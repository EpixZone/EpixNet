[package]
name = "emissary-util"
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eepnet/emissary"
description = "Rust implementation of the I2P protocol stack"
readme = "README.md"
authors = []
keywords = ["i2p", "network", "privacy"]
categories = []

[dependencies]
emissary-core = { git = "https://github.com/eepnet/emissary", rev = "4495edc6e67eccfa7d4bbb0c7b309febbf2e6a32", version = "0.4.0", default-features = false, features = ["std"] }
flate2 = { version = "1.1.2" }
home = "=0.5.11"
igd-next = { version = "0.16.1", default-features = false, features = ["aio_tokio"] }
metrics-exporter-prometheus = { version = "0.17.2", optional = true }
metrics = { version = "0.24.2", optional = true }
natpmp = "0.5.0"
netdev = { version = "0.36.0", default-features = false, features = ["gateway"] }
pem = { version = "3.0.5", default-features = false }
rsa = { version = "0.9.10", features = ["sha2"] }
x509-parser = "0.17.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib"] }

# workspace dependencies
anyhow = { version = "1.0.98" }
ed25519-dalek = { version = "3.0.0-pre.6", default-features = false, features = ["rand_core", "fast"] }
futures = { version = "0.3.31" }
nom = { version = "7.1.3", default-features = false, features = ["alloc"] }
rand = { version = "0.10.0", default-features = false, features = ["thread_rng"] }
reqwest = { version = "0.12.21", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
smol = { version = "2.0.2", optional = true }
socket2 = { version = "0.6.2" }
tempfile = { version = "3.20.0" }
tokio-util = { version = "0.7.15", features = ["compat"], optional = true }
tokio = { version = "1.45.1", features = ["full"], optional = true }
toml = { version = "0.8.23" }
tracing = { version = "0.1.41", default-features = false, features = ["log"] }
x25519-dalek = { version = "3.0.0-pre.6", default-features = false, features = ["getrandom", "static_secrets", "precomputed-tables"] }

[features]
# TLS backend for the HTTPS reseeder. `native-tls` (the default) keeps the
# existing behaviour (OpenSSL/Schannel/Secure Transport). `rustls` selects a
# pure-Rust stack so the crate cross-compiles without OpenSSL, e.g. to Android
# and iOS. Enable exactly one: `default-features = false` + `features = ["rustls"]`.
default = ["tokio", "native-tls"]
tokio = ["dep:tokio", "dep:tokio-util"]
smol = ["dep:smol"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
native-tls = ["reqwest/default-tls"]
rustls = ["reqwest/rustls-tls"]
