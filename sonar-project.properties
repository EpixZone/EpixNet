# SonarCloud configuration for EpixNet.
# Set up: import the repo at https://sonarcloud.io, then add SONAR_TOKEN as a
# GitHub Actions secret. Replace the org/key below with your SonarCloud values.
sonar.organization=epixzone
sonar.projectKey=EpixZone_EpixNet

sonar.sources=crates
sonar.exclusions=target/**,**/tests/**,**/examples/**
sonar.tests=crates
sonar.test.inclusions=**/tests/**

# Cognitive complexity (rust:S3776) is not scored on test code: a
# deterministic test reads top to bottom on purpose (a fuzz test's op match IS
# its specification), and test files are already registered as tests above.
# Production code is expected to stay under the limit. The functions that
# used to be listed here as permanent exceptions (the wire-request
# dispatcher, the frame demultiplexer, the swarm round loop, the Xor8
# construction, the backtracking glob matcher) have since been split and are
# all under it, so there is nothing to waive. If a future function genuinely
# has to exceed the limit, mark that one Accepted on its SonarCloud issue
# rather than waiving a file here - a file waiver would silence every future
# function in the file too.
sonar.issue.ignore.multicriteria=t1
sonar.issue.ignore.multicriteria.t1.ruleKey=rust:S3776
sonar.issue.ignore.multicriteria.t1.resourceKey=**/tests/**

# Rust analysis in SonarCloud/SonarQube uses clippy output. Point it here if you
# export clippy to SARIF in CI.
# sonar.rust.clippy.reportPaths=clippy.sarif
