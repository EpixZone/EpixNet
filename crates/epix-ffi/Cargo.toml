[package]
name = "epix-ffi"
version = "0.1.0"
edition = "2021"
description = "UniFFI bindings exposing the Epix node to Kotlin (Android) and Swift (iOS). The mobile shells embed this in-process."

[lib]
# cdylib for the phones to load; staticlib for the iOS link; rlib for tests.
crate-type = ["lib", "cdylib", "staticlib"]
name = "epix_ffi"

# The bindings generator, only built with `--features cli` (needs uniffi/cli).
[[bin]]
name = "uniffi-bindgen"
required-features = ["cli"]

[build-dependencies]
epix-build = { path = "../epix-build" }

[dependencies]
epix-core = { path = "../epix-core" }
epix-node = { path = "../epix-node", default-features = false }
epix-chain = { path = "../epix-chain" }
uniffi = { version = "0.32", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
thiserror = "2"

[features]
# The embedded I2P router is compiled in AND auto-enabled on first run, same as
# desktop (privacy by default). It's a leaf: transit tunnels are disabled and
# it's not a floodfill, so it only carries our own traffic - roughly Tor-client
# footprint (~20 MB, low CPU), which is why it's on by default on a phone too.
# The embedded router cross-compiles to mobile because emissary's reseeder can
# use rustls instead of OpenSSL. Users can still switch it off in Config.
#
# `mesh` and `local-discovery` are in the default too, so a phone carries the
# two transports that work with no internet at all (an isolated LAN, an
# air-gapped mesh). Both are inert until switched on in Config - `mesh`
# defaults to disable and `local_discovery` to false, so an unconfigured phone
# spawns no task and binds no socket for either. They cost ~12 crates
# (`reticulum`, `tonic`, `prost` and support) on top of the hyper/tower stack
# reqwest and arti already pull in.
#
# NOTE for the mobile shells: `local_discovery` also needs platform permission
# to do anything. iOS drops local-network traffic without
# NSLocalNetworkUsageDescription in Info.plist, and Android must hold a
# WifiManager.MulticastLock to RECEIVE broadcast replies. Both are wired in
# their shells; dropping either makes the feature compile but stay dead.
default = ["tor", "i2p-embedded", "mesh", "local-discovery"]
tor = ["epix-node/tor"]
# Reticulum mesh transport (config-gated, default disable).
mesh = ["epix-node/mesh"]
# LAN peer discovery over UDP broadcast (config-gated, default off).
local-discovery = ["epix-node/local-discovery"]
# In-process Tor pluggable transports (Snowflake) for censored networks. NOT in
# `default`: only opted-in builds carry the IPtProxy (Go) dependency. Android
# and iOS opt in via their build scripts once the artifact is vendored.
bridges = ["epix-node/bridges"]
i2p = ["epix-node/i2p"]
i2p-embedded = ["i2p", "epix-node/i2p-embedded", "epix-node/i2p-autostart"]
# BitTorrent bridge. Deliberately NOT in `default`: the Android build script
# opts in (`--features tor,i2p-embedded,bittorrent`), the iOS build script
# never does, so the iOS staticlib is BT-free by construction (App Store
# 5.2.3). CI builds the iOS profile and fails if a BT symbol appears.
bittorrent = ["epix-node/bittorrent"]
# Generate the `uniffi-bindgen` CLI entry point (used by the mobile build
# scripts to emit Kotlin/Swift). Kept behind a feature so the library builds
# without pulling the CLI into every consumer.
cli = ["uniffi/cli"]
