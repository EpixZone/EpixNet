[package]
name = "evx-state"
version = "0.1.0"
edition = "2021"
description = "EVX host-owned SQLite durable state: grants, reservations, outbox, checkpoints."

[dependencies]
evx-api = { path = "../evx-api" }
# The typed `Schedule` a job is registered with. evx-declaration depends on
# evx-activation and evx-api only, never on this crate, so there is no cycle.
evx-declaration = { path = "../evx-declaration" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
rand = "0.9"

[dev-dependencies]
tempfile = "3"
