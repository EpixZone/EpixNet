[package]
name = "evx-host"
version = "0.1.0"
edition = "2021"
description = "EVX host: binds signed activation to the supervisor, and a JSON-on-stdin CLI for external harnesses."

[lib]
path = "src/lib.rs"

[[bin]]
name = "evx-host"
path = "src/main.rs"

[dependencies]
evx-api = { path = "../evx-api" }
evx-activation = { path = "../evx-activation" }
evx-supervisor = { path = "../evx-supervisor" }
evx-runtime = { path = "../evx-runtime", features = ["text"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
evx-activation = { path = "../evx-activation", features = ["fixtures"] }
ed25519-dalek = { version = "3", default-features = false }
rand = "0.9"
tempfile = "3"
