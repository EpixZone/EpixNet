[package]
name = "epix-chain"
version = "0.1.0"
edition = "2021"
description = "Epix chain layer: chain-verified .epix name resolution (XidResolver) via Merkle proof + validator finality."

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
sha2 = "0.11"
# Client-side finality verification: verify validator ed25519 attestation
# signatures over the state digest against a pinned set. Deliberately NO
# tendermint-rs / ics23 — the thin, mobile-friendly path (see finality.rs).
ed25519-dalek = { version = "3", default-features = false }
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
fslock-guard = "0.8"
tokio = { version = "1", features = ["sync", "time"] }
tendermint-light-client-verifier = "0.40"
tendermint = { version = "0.40", default-features = false, features = ["rust-crypto"] }
bech32 = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
