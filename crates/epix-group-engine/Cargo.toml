[package]
name = "epix-group-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
chacha20poly1305 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
hex = "0.4"
getrandom = "0.4"
zeroize = { version = "1", features = ["derive"] }
