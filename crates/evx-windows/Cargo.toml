[package]
name = "evx-windows"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "evx-windows-worker"
path = "src/worker_main.rs"

[target.'cfg(windows)'.dependencies]
evx-api = { path = "../evx-api" }
evx-runtime = { path = "../evx-runtime", features = ["pulley", "text"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Security_Isolation", "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading",
  "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Pipes", "Win32_System_IO",
  "Win32_System_WindowsProgramming", "Win32_System_ProcessStatus",
  "Win32_System_LibraryLoader", "Win32_UI_Shell",
] }
