[package]
name = "epix-xite"
version = "0.1.0"
edition = "2021"
description = "Xite lifecycle: storage, content.json load/verify, file accounting, and peer announcing."

[dependencies]
epix-core = { path = "../epix-core" }
epix-blob = { path = "../epix-blob" }
epix-selfenc = { path = "../epix-selfenc" }
epix-content = { path = "../epix-content" }
epix-crypt = { path = "../epix-crypt" }
epix-discovery = { path = "../epix-discovery" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# content.json `ignore` patterns are Python regexes with lookaheads
# (e.g. `css/(?!all\.css)`), which the plain regex crate can't express.
fancy-regex = "0.19"
rmpv = "1"
sha2 = "0.11"
hex = "0.4"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
epix-crypt = { path = "../epix-crypt" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }
