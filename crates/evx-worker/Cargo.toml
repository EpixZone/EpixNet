[package]
name = "evx-worker"
version = "0.1.0"
edition = "2021"
description = "EVX sandboxed worker binary: run, compile and file-helper modes. Confines itself before reading any untrusted bytes."

[[bin]]
name = "evx-worker"
path = "src/main.rs"

[dependencies]
evx-api = { path = "../evx-api" }
evx-runtime = { path = "../evx-runtime", features = ["text"] }
evx-workspace = { path = "../evx-workspace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs", "process", "pipe"] }

[target.'cfg(windows)'.dependencies]
evx-windows-native = { path = "../evx-windows-native" }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading",
] }

[features]
apple-xpc = ["evx-runtime/pulley"]

[dev-dependencies]
tempfile = "3"
