[package]
name = "epix-rln"
version = "0.1.0"
edition = "2021"
description = "Anonymous rate-limiting for the ECX pool via Rate-Limiting Nullifiers (zerokit RLN). Proves pool-record admission rights without revealing which member sent it; double-signalling within an epoch reveals the offender's secret for reputation-based eviction."

[dependencies]
# zerokit RLN (PSE / vacp2p): audited Groth16 RLN over BN254, patched at the
# workspace root to gate off the sled-backed tree (see vendor/rln). We use only
# the stateless verifier; the membership tree is xID-anchored and lives outside.
rln = { version = "3", default-features = false }
# In-memory sparse Merkle tree (the same backend rln's circuit expects) for the
# membership tree, plus Poseidon.
zerokit_utils = { version = "3", default-features = false }
# Deterministic identity derivation (xID-anchored: same seed -> same identity).
# The derived identities are pinned by tests/identity_golden.rs: any bump that
# shifts the seeded output stream fails that known-answer test.
rand_chacha = "0.10"
# The trait generation the vendored rln + arkworks 0.5 sample through; the
# seeded_rng bridge implements these over the modern ChaCha20Rng.
rand_core06 = { package = "rand_core", version = "0.6" }
thiserror = "2"
# Hex encoding for the owner-signed membership roster (commitment <-> string).
hex = "0.4"

[dev-dependencies]
rand = "0.10"
