[package]
name = "epix-discovery"
version = "0.1.0"
edition = "2021"
description = "Peer discovery for EpixNet: Epix tracker (epix://) announce over EDX. BitTorrent trackers / DHT / PEX land here too."

[dependencies]
epix-core = { path = "../epix-core" }
async-trait = "0.1"
# default-features off: postcard's default heapless support drags the
# unmaintained atomic-polyfill (RUSTSEC-2023-0089); we only need std.
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
sha1 = { version = "0.11.0", optional = true }
sha2 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
tokio = { version = "1", features = ["net", "time"], optional = true }

[features]
# Opted into by the desktop/Android node profile; absent from iOS.
bittorrent = ["dep:sha1", "dep:reqwest", "dep:tokio"]

[[example]]
name = "bt_probe"
required-features = ["bittorrent"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
