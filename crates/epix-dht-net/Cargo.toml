[package]
name = "epix-dht-net"
version = "0.1.0"
edition = "2021"
description = "Binds epix-dht to the wire: DHT RPCs over peer Connections (server handler + dial-on-demand client)."

[dependencies]
epix-core = { path = "../epix-core" }
epix-dht = { path = "../epix-dht" }
epix-protocol = { path = "../epix-protocol" }
epix-transport = { path = "../epix-transport" }
async-trait = "0.1"
rmpv = "1"
# default-features off: postcard's default heapless support drags the
# unmaintained atomic-polyfill (RUSTSEC-2023-0089); we only need std.
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
hex = "0.4"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
