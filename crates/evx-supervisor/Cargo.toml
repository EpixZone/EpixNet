[package]
name = "evx-supervisor"
version = "0.1.0"
edition = "2021"
description = "EVX trusted supervisor: capability broker, workspace lease, confined child processes, kernel resource observations and effect-outcome semantics."

[dependencies]
evx-api = { path = "../evx-api" }
evx-workspace = { path = "../evx-workspace" }
evx-runtime = { path = "../evx-runtime" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
evx-windows-native = { path = "../evx-windows-native" }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Registry",
  "Win32_System_Threading",
] }

[features]
apple-xpc = ["evx-runtime/pulley"]

[build-dependencies]
cc = "1"

[[bin]]
name = "evx-xpc-service"
path = "src/xpc_service_main.rs"
required-features = ["apple-xpc"]

[dev-dependencies]
evx-runtime = { path = "../evx-runtime", features = ["text"] }
tempfile = "3"
base64 = "0.22"
serde_json = "1"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
