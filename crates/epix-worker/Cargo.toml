[package]
name = "epix-worker"
version = "0.1.0"
edition = "2021"
description = "Peer-outcome reputation types (PeerOutcome) that every fetch path reports so the peer registry can reward good seeders and back off dead ones."

[dependencies]
epix-core = { path = "../epix-core" }
epix-xite = { path = "../epix-xite" }
epix-transport = { path = "../epix-transport" }
tokio = { version = "1", features = ["rt", "sync", "macros"] }

[dev-dependencies]
epix-crypt = { path = "../epix-crypt" }
epix-content = { path = "../epix-content" }
epix-discovery = { path = "../epix-discovery" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
