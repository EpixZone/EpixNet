[package]
name = "evx-android"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
evx-api = { path = "../evx-api" }
evx-runtime = { path = "../evx-runtime", default-features = false, features = ["compiler", "pulley"] }
jni = "0.21.1"
serde_json = "1"

[dev-dependencies]
wat = "1.254"
