[package]
name = "epix-edx"
version = "0.1.0"
edition = "2021"
description = "EDX wire protocol: postcard framing over multiplexed PeerStreams, Noise-XX-first clearnet encryption with node-key channel binding, the EDX message set, and the deadline/rarest-first swarm scheduler with reciprocity choking."

[dependencies]
epix-core = { path = "../epix-core" }
epix-blob = { path = "../epix-blob" }
epix-crypt = { path = "../epix-crypt" }
epix-transport = { path = "../epix-transport" }
# default-features off: postcard's default heapless support drags the
# unmaintained atomic-polyfill (RUSTSEC-2023-0089); we only need std.
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
snow = "=0.10.0"
tokio = { version = "1", features = ["io-util", "net", "rt", "time", "sync"] }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "macros", "time", "test-util"] }
tempfile = "3"
