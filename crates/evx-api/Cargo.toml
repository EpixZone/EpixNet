[package]
name = "evx-api"
version = "0.1.0"
edition = "2021"
description = "EVX shared types: grants, limits, broker requests, supervisor/worker IPC frames and invocation results. No I/O."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
