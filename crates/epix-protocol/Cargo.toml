[package]
name = "epix-protocol"
version = "0.1.0"
edition = "2021"
description = "Peer plumbing shared by every transport: the inbound accept loop, the live connection registry, and the node's dial-back self-advert."

[dependencies]
epix-core = { path = "../epix-core" }
epix-transport = { path = "../epix-transport" }
tokio = { version = "1", features = ["io-util", "net", "rt", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "macros", "time", "test-util"] }
