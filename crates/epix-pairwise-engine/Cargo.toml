[package]
name = "epix-pairwise-engine"
version = "0.1.0"
edition = "2021"
description = "The real pairwise channel crypto engine: X25519 X3DH + Double Ratchet with header encryption, forward-secure detection-tag chains, and Elligator2 first-contact tags. Implements epix_envelope::Engine."

[dependencies]
epix-envelope = { path = "../epix-envelope" }
epix-crypt = { path = "../epix-crypt" }
# Sole curve library: a curve25519-dalek fork with Elligator2, so x25519 DH
# (MontgomeryPoint::mul_clamped) and uniform first-contact representatives share
# one point type.
curve25519-elligator2 = { version = "0.1.0-alpha.2", features = ["elligator2"] }
chacha20poly1305 = "0.11"
hkdf = "0.12"
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
hex = "0.4"
getrandom = "0.4"
zeroize = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
