[package]
name = "tor-time-format"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Arti configuration and persistent-state time formats for EpixNet"

[dependencies]
time = { version = "0.3", features = ["parsing"] }
serde = "1"
winnow = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
