[package]
name = "epix-blob"
version = "0.1.0"
edition = "2021"
description = "EDX verified blob core: BLAKE3/bao outboard trees, verified range encode/decode, the slab store with redb index, and chunk-group bitfields."

# bao-tree is pinned exactly: its encoded slice format is a wire- and
# (future) consensus-level contract. Bumping it requires re-running the
# golden vectors in tests/ and a deliberate spec revision.
[dependencies]
blake3 = "=1.8.7"
bao-tree = "=0.16.0"
positioned-io = "=0.3.5"
# default-features off: postcard's default heapless support drags the
# unmaintained atomic-polyfill (RUSTSEC-2023-0089); we only need std.
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
redb = "=4.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
epix-fs = { path = "../epix-fs" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
cap-std = "4.0.3"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
epix-selfenc = { path = "../epix-selfenc" }
tempfile = "3"
