[package]
name = "epix-mirror"
version = "0.1.0"
edition = "2021"
description = "Verified signed-xite package snapshots for standard package managers"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
epix-crypt = { path = "../epix-crypt" }
epix-fs = { path = "../epix-fs" }
flate2 = "1"
hex = "0.4"
liblzma = { version = "0.4.7", default-features = false, features = ["static"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
socket2 = "0.6"
tempfile = "3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tar = "0.4.46"
