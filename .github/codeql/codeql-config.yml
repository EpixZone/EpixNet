name: "EpixNet CodeQL config"

# Test code is not shipped, and a test that needs a FIXED key or salt is not a
# leaked secret - it is the only way the test can assert anything. Known-answer
# tests pin a salt on purpose, and negative tests pin a deliberately wrong one.
# Scanning these produced 24 critical "hard-coded cryptographic value" alerts
# with no production reachability.
#
# This covers integration tests and benchmarks, which live in their own files,
# plus unit-test modules that a crate keeps in `src/tests.rs` (declared as
# `#[cfg(test)] mod tests;`). Unit tests written inline in the same file as
# production code cannot be excluded by path without losing real coverage of
# that file; either move them to `src/tests.rs` or dismiss those alerts
# individually as "used in tests".
paths-ignore:
  - "**/tests/**"
  - "**/benches/**"
  - "**/examples/**"
  - "**/src/tests.rs"

# `rust/hard-coded-cryptographic-value` fires on every fixed value that reaches a
# salt/nonce/key/IV sink. In the metadata-private messaging engine
# (crates/epix-pairwise-engine) those are, by construction, almost entirely
# DOMAIN-SEPARATION CONSTANTS that MUST be fixed and public, not secrets:
#   * HKDF `info` contexts (e.g. "epix-channel/rk/v1", "…/x3dh/v1", "…/tck/v1"),
#   * HMAC chain-key labels (0x01 / 0x02) and tag-chain labels ("tag"/"hdr"/"chain"),
#   * AEAD nonce domain labels ("est-hdr" / "fc-hdr") — the actual nonce is
#     DERIVED from a per-record varying tag, so nothing is reused,
#   * the fixed public X3DH salt 0xFF^32 (as in the Signal X3DH spec).
# The query cannot distinguish a public domain separator from a leaked key, so it
# is a false positive here for every hit. The whole construction is specified and
# external-review-gated in docs/channel-crypto-spec.md with frozen KAT vectors,
# and hard-coded SECRETS are caught separately by the required gitleaks check.
query-filters:
  - exclude:
      id: rust/hard-coded-cryptographic-value
