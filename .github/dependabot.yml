version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: cargo
    directory: "/"
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    # Type-only ignores apply to routine updates, not security fixes.
    # Cargo's current 0.x filtering can also suppress later major upgrades;
    # review pre-1.0 upgrades manually when planning dependency migrations.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
