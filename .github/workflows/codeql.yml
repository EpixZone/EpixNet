name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"

permissions: {}

jobs:
  analyze:
    name: Analyze (Rust)
    runs-on: ubuntu-latest
    # CodeQL Rust analysis is slower than a plain build; cap well below the 6h
    # default so a stalled runner (e.g. a hung apt mirror) fails fast.
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    env:
      # The extractor runs the workspace build scripts; skip the wallet
      # extension download (network access, irrelevant to analysis).
      EPIX_WALLET_SKIP: "1"
      # Point the extractor's internal cargo runs at ./target so rust-cache
      # can persist them between runs.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert hard-coded cryptographic value analysis is enabled
        run: |
          if grep -q 'rust/hard-coded-cryptographic-value' .github/codeql/codeql-config.yml; then
            echo "::error::Do not disable hard-coded cryptographic value analysis repository-wide"
            exit 1
          fi
      # The Rust extractor resolves code with rust-analyzer, so it needs the
      # same environment as a real build: a toolchain with the rust-src
      # component (standard library sources), the dependency sources, and the
      # system libraries the build scripts probe for. Without these, calls
      # into std and third-party crates stay unresolved and code scanning
      # reports "Low Rust analysis quality".
      - name: Install Linux build deps (protoc + libudev for the Ledger HID bridge; GTK/AppIndicator for the system tray)
        # `timeout` per apt call + retry: a stalled Azure apt mirror otherwise
        # hangs the step for the full 6h job timeout (observed on this branch).
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for i in 1 2 3; do
            if sudo timeout 300 apt-get update && \
               sudo timeout 300 apt-get install -y --no-install-recommends \
                 protobuf-compiler libudev-dev pkg-config libgtk-3-dev \
                 libayatana-appindicator3-dev libxdo-dev; then
              exit 0
            fi
            echo "::warning::apt attempt $i failed or timed out; retrying in 15s"
            sleep 15
          done
          echo "::error::apt-get failed after 3 attempts"; exit 1
      # Pinned to 1.94, not stable: the extractor's bundled rust-analyzer
      # (ra_ap 0.0.301 in CodeQL 2.26.0) passes --lockfile-path to
      # `cargo metadata`, and cargo 1.95+ removed that flag. cargo then exits
      # with an error, rust-analyzer silently falls back to a workspace with
      # no dependency or std resolution, and the scan reports "Low Rust
      # analysis quality". 1.94 is the last toolchain that accepts the flag.
      # Unpin to stable once the CodeQL bundle ships a rust-analyzer with the
      # upper version bound fix (rust-lang/rust-analyzer#21783).
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # 1.94
        with:
          toolchain: "1.94"
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Fetch dependencies
        run: cargo fetch --locked
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: rust
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:rust"
