name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  native-coverage:
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exercise Apple protocol and package-policy boundaries
        run: python3 packaging/macos/xpc/test-native-coverage.py --output coverage/evx-apple.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evx-native-coverage
          path: coverage/evx-apple.xml
          if-no-files-found: error

  sonarcloud:
    needs: native-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: evx-native-coverage
          path: coverage
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
