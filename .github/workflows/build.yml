name: Build

# On-demand test builds - no tag, no signing, no Release. Trigger from the
# Actions tab -> "Build" -> "Run workflow", optionally picking one platform to
# build faster. The artifacts (unsigned) are attached to the run for download.
# For a real signed release, push a `v*` tag (that's release.yml).

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, macos, linux, windows]

permissions:
  contents: read

jobs:
  macos:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (mesh transport build dep)
        run: |
          # The macOS runner pre-taps aws/tap, which newer Homebrew treats as
          # untrusted and warns about on every brew command. We don't use it, so
          # untap it to keep the log clean (protobuf is from homebrew/core).
          brew untap aws/tap 2>/dev/null || true
          brew install protobuf
      - name: Fetch Firefox ESR to bundle
        run: packaging/fetch-firefox-esr.sh osx
      - name: Build (ad-hoc signed, unnotarized)
        env:
          EPIX_MAKE_DMG: "1"
          EPIX_BUNDLE_FIREFOX: ${{ github.workspace }}/packaging/firefox-esr/Firefox.app
        run: packaging/macos/build-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: epix-macos-unsigned
          path: dist/Epix-*.dmg

  linux:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-22.04
    env:
      EPIX_RELEASE_BUILD: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps (protoc + libudev for the Ledger HID bridge; GTK/AppIndicator for the system tray)
        run: sudo bash packaging/linux/install-build-deps.sh
      - name: Fetch Firefox ESR to bundle
        run: packaging/fetch-firefox-esr.sh linux
      - name: Build Linux desktop installers
        env:
          EPIX_BUNDLE_FIREFOX: ${{ github.workspace }}/packaging/firefox-esr/firefox
        run: packaging/linux/build-linux.sh
      - name: Validate Linux packaging
        run: |
          python3 packaging/linux/test-packaging.py
          shellcheck packaging/linux/*.sh packaging/linux/AppRun packaging/fetch-firefox-esr.sh
          desktop-file-validate packaging/linux/epix.desktop
          sudo apt-get install -y ./dist/*.deb
          EPIX_DATA_DIR="$(mktemp -d)" epix-browser --quit
          /opt/epixnet/firefox/firefox --headless --version
          xvfb-run -a python3 packaging/linux/smoke-desktop.py /usr/bin/epix-browser
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a python3 packaging/linux/smoke-desktop.py dist/*.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: epix-linux
          path: |
            dist/epix-linux-*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/enable-epixnet-sandbox.sh
            dist/SHA256SUMS

  linux-package-tests:
    needs: linux
    uses: ./.github/workflows/linux-package-tests.yml

  windows:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install protoc (mesh transport build dep)
        run: choco install protoc -y --no-progress
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Fetch Firefox ESR to bundle
        shell: bash
        run: packaging/fetch-firefox-esr.sh win64
      - name: Build installer (unsigned)
        shell: bash
        env:
          EPIX_BUNDLE_FIREFOX: ${{ github.workspace }}/packaging/firefox-esr/firefox
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          packaging/windows/build-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: epix-windows-unsigned
          path: dist/Epix-Setup-*.exe
