name: Build

# Temporary QA branch only. Baseline source and packaged release are immutable.
# No installer build, signing, publication, or production fix occurs here.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Bounded native baseline target
        type: choice
        default: windows
        options: [windows]
permissions:
  contents: read
jobs:
  windows-data-directory:
    name: Windows data directory baseline
    runs-on: windows-2025
    timeout-minutes: 22
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out QA fixture only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out exact current baseline separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b5353fb1ab2440652b2bff23cbb99c819df783f6
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Record runner and source provenance
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          @{
            source_revision = (git -C source rev-parse HEAD).Trim()
            fixture_revision = (git rev-parse HEAD).Trim()
            fixture_sha256 = (Get-FileHash packaging/windows/issue-649-baseline.py -Algorithm SHA256).Hash.ToLowerInvariant()
            owned_process_helper_sha256 = (Get-FileHash packaging/windows/issue-649-owned-job.py -Algorithm SHA256).Hash.ToLowerInvariant()
            browser_source_sha256 = (Get-FileHash source/crates/epix-browser/src/main.rs -Algorithm SHA256).Hash.ToLowerInvariant()
            paths_source_sha256 = (Get-FileHash source/crates/epix-ui/src/paths.rs -Algorithm SHA256).Hash.ToLowerInvariant()
            os_caption = $os.Caption; os_version = $os.Version; os_build = $os.BuildNumber
            image_os = $env:ImageOS; image_version = $env:ImageVersion
            rustc = @(rustc -Vv); python = @(python --version)
            volumes = @(Get-Volume | Select-Object DriveLetter, FileSystemType, UniqueId, Size, SizeRemaining)
            free_bytes = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:RUNNER_TEMP)).AvailableFreeSpace
          } | ConvertTo-Json -Depth 6 | Set-Content evidence/runner.json -Encoding utf8
      - name: Download and verify the immutable packaged baseline
        timeout-minutes: 5
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'issue-649-package'
          New-Item -ItemType Directory -Force $root | Out-Null
          $installer = Join-Path $root 'Epix-Setup-0.5.23.exe'
          Invoke-WebRequest 'https://github.com/EpixZone/EpixNet/releases/download/v0.5.23/Epix-Setup-0.5.23.exe' -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne 'ed18f5dd2c2e6935b30d4bc36d3b3fda53581f88d93c923690c591d1b80f1bba') { throw 'release digest mismatch' }
          & 7z x $installer "-o$root/extracted" -y | Out-File evidence/extract.log
          if ($LASTEXITCODE -ne 0) { throw 'installer extraction failed' }
      - name: Native path helper and real Config relocation baseline
        id: fixture
        timeout-minutes: 13
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'issue-649-package'
          python packaging/windows/issue-649-baseline.py --source source --installer "$root/Epix-Setup-0.5.23.exe" --package "$root/extracted" --output evidence
          if ($LASTEXITCODE -ne 0) { throw 'fixture incomplete; inspect retained evidence' }
      - name: Clean owned extracted package and record outcome
        if: always()
        timeout-minutes: 2
        env:
          FIXTURE_OUTCOME: ${{ steps.fixture.outcome }}
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $root = Join-Path $env:RUNNER_TEMP 'issue-649-package'
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          @{
            fixture_outcome = $env:FIXTURE_OUTCOME
            package_removed = !(Test-Path -LiteralPath $root)
            finished_utc = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content evidence/workflow-outcome.json -Encoding utf8
      - name: Upload bounded diagnostics, not disposable profiles or keys
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-649-windows-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/*.json
            evidence/*.log
            evidence/*.png
            evidence/*.rs
          if-no-files-found: error
          retention-days: 7
