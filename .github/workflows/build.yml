name: Build
# QA branch only: official Windows updater and exact reader modules.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-official-updater:
    name: Windows signed MAR and addon guard
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.99.1
      - name: Record runner and exact fixture provenance
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          @{ fixture_revision=(git rev-parse HEAD).Trim(); os=(Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber); image=$env:ImageVersion; rustc=@(rustc -Vv); python=@(python --version) } | ConvertTo-Json -Depth 5 | Set-Content evidence/runner.json -Encoding utf8
      - name: Build bounded exact production metadata reader
        timeout-minutes: 7
        run: |
          python packaging/windows/issue-646-build-reader.py --output evidence
          if ($LASTEXITCODE -ne 0) { throw 'reader compilation failed' }
      - name: Apply signed official MAR and inspect updated owned profile
        timeout-minutes: 12
        run: |
          python packaging/windows/issue-646-updater.py --output evidence --metadata-reader evidence/metadata-reader.exe
          if ($LASTEXITCODE -ne 0) { throw 'updater or native cache acceptance failed' }
      - name: Remove only owned intermediates
        if: always()
        timeout-minutes: 3
        run: |
          $roots = @(Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory | Where-Object { $_.Name -like 'epix646-update-*' -or $_.Name -eq 'epix646-metadata-reader' })
          foreach($root in $roots) { Remove-Item -LiteralPath $root.FullName -Recurse -Force }
          @{ roots=@($roots.FullName); all_removed=@($roots | Where-Object {Test-Path -LiteralPath $_.FullName}).Count -eq 0; utc=[DateTime]::UtcNow.ToString('o') } | ConvertTo-Json -Depth 4 | Set-Content evidence/workflow-cleanup.json -Encoding utf8
      - name: Retain bounded QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-646-windows-updater-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
