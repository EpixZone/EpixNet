name: CI

# Compiles the whole workspace so a dependency bump that does not build is
# caught here, not after it lands on main. The scanning workflows
# (security.yml, codeql.yml) do not gate on the build, so this fills that gap.

on:
  push:
    # edx: long-lived EDX protocol branch — every push must build and test
    # green so the branch stays bisectable. evx: the EVX sandboxed-runtime
    # branch, same rule (its macOS sandbox job only runs here).
    branches: [main, edx, evx]
  pull_request:
    branches: [main, evx]

permissions: {}

jobs:
  android-wallet-staging:
    name: Android shell regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 shells/android/tests/run-wallet-staging-regressions.py
      - name: Test Android startup and controls
        run: |
          export KOTLINC="$(command -v kotlinc)"
          "$KOTLINC" -version
          export COROUTINES_JAR="$RUNNER_TEMP/kotlinx-coroutines-core-jvm-1.9.0.jar"
          # Maven Central rate-limits the shared runner addresses (HTTP 429), which
          # failed an otherwise green run. The checksum below makes any source
          # safe, so wait between attempts and fall back to the Google mirror.
          # --retry-max-time bounds the window: a 429 with a long Retry-After
          # must fail over to the mirror, not sleep past the job timeout.
          ARTIFACT="org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.9.0/kotlinx-coroutines-core-jvm-1.9.0.jar"
          download_coroutines() {
            local url
            for url in "https://repo.maven.apache.org/maven2/$ARTIFACT" "https://maven-central.storage-download.googleapis.com/maven2/$ARTIFACT"; do
              if curl --fail --location --no-progress-meter --retry 4 --retry-delay 10 --retry-max-time 120 --connect-timeout 10 --max-time 120 "$url" --output "$COROUTINES_JAR"; then
                return 0
              fi
              echo "Download failed from $url" >&2
            done
            return 1
          }
          download_coroutines
          echo "ad89c2892235e670f222d819cb3d81188143cb19a05b59df9889ae4269f5c70a  $COROUTINES_JAR" | sha256sum --check
          python3 shells/android/tests/run-node-host-regressions.py
          python3 shells/android/tests/run-browser-host-regressions.py
          python3 shells/android/tests/run-addon-policy-regressions.py
          python3 shells/android/tests/run-browser-settings-regressions.py
          python3 shells/android/tests/run-pending-operations-regressions.py
          python3 shells/android/tests/run-guarded-session-regressions.py
          python3 shells/android/tests/run-picked-file-regressions.py
          python3 shells/android/tests/run-file-response-regressions.py
          python3 shells/android/tests/run-activity-lifecycle-regressions.py
          python3 shells/android/tests/run-startup-regressions.py
          python3 shells/android/tests/run-toolbar-regressions.py
          python3 shells/android/tests/run-fullscreen-regressions.py
          python3 shells/android/tests/run-window-insets-regressions.py

  linux-packaging:
    name: Linux packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Install packaging test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor python3 xz-utils desktop-file-utils libglib2.0-bin
      - name: Test Linux packaging and sandbox rules
        run: |
          python3 packaging/test-firefox-download.py -v
          python3 packaging/linux/test-packaging.py -v
          python3 packaging/linux/test-autostart.py -v
          python3 packaging/linux/test-evx-package.py -v

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    # A warm-cache build+test is ~5-7 min; cap well below the 6h default so a
    # stalled runner fails fast instead of burning a 6h slot.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The full browser suite checks the packaged wallet too. Allow build.rs
      # to stage the release pinned by wallet-ext.rev and verify its SHA-256.
      # Treat warnings as errors so the build stays warning-free. cargo caps
      # dependency lints to `allow`, so this only gates our own crates.
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test bounded apt mirror fallback
        run: python3 scripts/test_ci_install_apt_deps.py -v
      - name: Install Linux build deps (protoc + libudev for the Ledger HID bridge; GTK/AppIndicator for the system tray)
        # Bound stalled downloads and leave Azure after the first failure.
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
            python3 scripts/ci_install_apt_deps.py \
              protobuf-compiler libudev-dev pkg-config libgtk-3-dev \
              libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Assert native host delegates xID resolution to the node
        run: |
          if grep -q '^epix-chain[[:space:]]*=' crates/epix-nmh/Cargo.toml || \
             grep -R -n -E 'epix_chain|XidResolver|try_resolve_on_chain|resolve_on_chain|cached_resolution|write_resolve_cache' crates/epix-nmh/src; then
            echo "::error::epix-nmh must use the authenticated node endpoint and must not resolve or cache xID names itself"
            exit 1
          fi
      # --all-targets also compiles tests and examples, so a break in any of
      # them (like the RustCrypto bump) fails here.
      - name: Build (all targets)
        run: cargo build --workspace --all-targets --locked
      - name: Test browser startup, handoff, add-on cache, and local wallet staging
        run: cargo test -p epix-browser --locked
      - name: Test generated proxy routes and wrapper behavior
        run: |
          cargo test -p epix-browser-net --locked
          python3 scripts/test_android_native.py
          python3 scripts/test_mobile_wallet.py
          node --test crates/epix-browser/tests/pac-routing.test.cjs
          node --test packaging/firefox-addons/tests/*.test.mjs
          node --test ui/tests/*.test.cjs
      # Run the deterministic crypto vectors (sslcrypto + Python interop), so a
      # change that compiles but breaks byte-compatibility is caught too.
      - name: Test crypto byte-compatibility
        run: cargo test -p epix-crypt --locked
      # The EDX gates: frozen slice format golden vectors, store crash-reopen,
      # wire protocol over sim and real TCP+Noise, self-encryption KATs, the
      # disk-audit and independent-recompute gates. These are the proofs the
      # edx branch rests on, so they run on every push.
      - name: Test EDX crates and database ingestion
        run: cargo test -p epix-blob -p epix-selfenc -p epix-edx -p epix-feed -p epix-search -p epix-xite -p epix-content -p epix-db --locked
      # The crates that consume EDX: the node runtime (resync, propagation), the
      # UI server and its WS commands, the DHT-over-payloads path, and EDX over
      # the Reticulum mesh. Their suites were compiled by the build step but
      # never run, so regressions they guard could land green. Every test here
      # binds loopback only. The 310s idle-reaper test in epix-runtime is
      # #[ignore]d and stays skipped.
      - name: Test EDX runtime, UI and wire crates
        run: |
          cargo test -p epix-runtime -p epix-ui -p epix-dht-net -p epix-reticulum --features epix-runtime/i2p --locked
          cargo test -p epix-ui --example merger_index_benchmark --locked
      # Security-critical channel suites must execute, not merely compile under
      # `build --all-targets`. These cover finality-backed identity resolution,
      # durable ratchet/outbox behavior, pairwise and group engines, and RLN.
      - name: Test metadata-private channel crates
        run: cargo test -p epix-chain -p epix-envelope -p epix-channel -p epix-pairwise-engine -p epix-group-engine -p epix-rln -p epix-plugins -p epix-node -p epix-nmh -p epix-ffi --locked
      # EVX (sandboxed xite execution, docs/evx.md): these suites
      # exercise Linux Landlock plus seccomp here and Seatbelt in the macOS
      # job below. A runner without confinement must fail the integration gate.
      - name: Test EVX validator, workspace, activation, durable state and node service
        run: EVX_REQUIRE_LINUX_CONFINEMENT=1 cargo test -p evx-api -p evx-declaration -p evx-runtime -p evx-workspace -p evx-activation -p evx-state -p evx-worker -p evx-supervisor -p evx-host -p epix-evx --locked
      - name: Verify the built Linux worker confinement and artifact transport
        run: python3 packaging/linux/verify-evx-worker.py target/debug/evx-worker
      - name: Verify a privileged parent cannot lend capabilities to an EVX worker
        run: sudo python3 packaging/linux/verify-evx-worker.py target/debug/evx-worker --require-privileged-parent

  windows-time-regressions:
    name: Windows filesystem and time regressions
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      # This excluded vendored crate has a standalone dependency graph. Avoid
      # building or caching the full workspace to exercise Windows clock limits.
      - name: Test Windows clock limits and coarse-clock progress
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/saturating-time-tests
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: cargo test --manifest-path vendor/saturating-time/Cargo.toml
      - name: Test Windows data moves and canonical PAC paths
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
          EPIX_TEST_FETCH_DEPS: "1"
        run: |
          python scripts/test_data_relocation.py
          node --test crates/epix-browser/tests/pac-routing.test.cjs

  apple-filesystem-regressions:
    name: Apple filesystem regressions
    runs-on: macos-14
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
      EPIX_TEST_FETCH_DEPS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Test native directory ownership, recovery and PAC paths
        run: |
          python3 scripts/test_data_relocation.py
          node --test crates/epix-browser/tests/pac-routing.test.cjs

  mobile-profiles:
    name: Mobile feature profiles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      EPIX_WALLET_SKIP: "1"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build deps (protoc)
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
            python3 scripts/ci_install_apt_deps.py protobuf-compiler pkg-config
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The actual iOS/Android target builds need the Apple SDK / Android NDK on
      # a matching runner (release pipeline). Here we validate the FEATURE
      # PROFILES resolve and compile on the host - a dependency leaking into the
      # wrong profile fails at feature resolution, which is what we guard.
      # `mesh,local-discovery` are in both profiles: the offline-capable
      # transports ship on every platform, config-gated off. (`bridges` is
      # omitted here - it links the vendored IPtProxy artifact, which this
      # runner does not have; the release pipeline builds that profile.)
      - name: iOS profile (BitTorrent excluded)
        run: cargo build -p epix-ffi --no-default-features --features tor,i2p-embedded,mesh,local-discovery --locked
      - name: Android profile (BitTorrent included)
        run: cargo build -p epix-ffi --no-default-features --features tor,i2p-embedded,mesh,local-discovery,bittorrent --locked
      # Check each product separately: a workspace build unifies features and
      # cannot prove that iOS excludes BT or that Android/desktop retain it.
      - name: Assert platform BitTorrent boundaries
        run: python3 scripts/check-platform-features.py
      # Resolve each product against its actual target. Unsupported node
      # targets and download-only embedders must not link the EVX runtime.
      - name: Assert EVX platform boundaries
        run: python3 scripts/check-evx-platforms.py
      - name: Test tracker discovery with and without BitTorrent
        run: |
          cargo test -p epix-discovery -p epix-xite --locked
          cargo test -p epix-discovery -p epix-xite --features epix-xite/bittorrent --locked

  ios-bridge-regressions:
    name: iOS bridge authorization regressions
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 shells/ios/tests/run-regressions.py

  evx-sandbox:
    name: EVX sandbox (macOS)
    runs-on: macos-latest
    # Build both the direct worker and signed Apple development host. Native
    # containment and service-retirement checks require this macOS runner.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The epix-evx service suite builds the worker itself (as the evx-host
      # suite does), so it finds the binary this step already produced.
      - name: Build the confined worker and the hostile peer
        run: cargo build -p evx-worker -p evx-host -p evx-supervisor --bins --example hostile_peer --locked
      - name: Test containment, hostile IPC, lifecycle, signed activation and the node service against the real worker
        run: EVX_REQUIRE_LINUX_CONFINEMENT=1 cargo test -p evx-api -p evx-declaration -p evx-runtime -p evx-workspace -p evx-activation -p evx-state -p evx-worker -p evx-supervisor -p evx-host -p epix-evx --locked

      - name: Test Pulley through the real worker, IPC and signed activation
        run: cargo test -p evx-api -p evx-runtime -p evx-worker -p evx-supervisor -p evx-host --features evx-runtime/pulley --locked
      - name: Test compiler-free Pulley artifact compatibility
        run: python3 scripts/test-evx-pulley-runtime.py
      - name: Test macOS packaging policy
        run: python3 packaging/macos/test-evx-package.py
      - name: Test signed XPC transport fixtures and lifecycle limits
        run: python3 packaging/macos/xpc/test-xpc.py
      - name: Test disabled Apple backend lifecycle handling
        run: python3 packaging/macos/xpc/test-backend-lifecycle.py
      - name: Test Apple slot, workspace and lifecycle journals
        run: cargo test -p evx-supervisor --features apple-xpc --locked
      - name: Test signed Apple development service-pool packaging
        run: python3 packaging/macos/xpc/test-package-backend.py
      - name: Test inherited native Apple container and process boundaries
        run: python3 packaging/macos/xpc/test-native-isolation.py
      - name: Test signed Apple adapter compilation, execution, cancellation and admission
        run: python3 packaging/macos/xpc/test-backend.py
      - name: Test the node development backend and admission policy
        run: cargo test -p epix-evx --features apple-xpc-development --locked
      - name: Test signed Apple node consent, manual work, recovery and scheduling
        run: python3 packaging/macos/xpc/test-node-backend.py
      - name: Test sealed Developer ID package mechanics with ad-hoc fixtures
        run: python3 packaging/macos/xpc/test-release-pool.py

  evx-ios-library:
    name: EVX Pulley library (iOS, no host admission)
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-D warnings"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # These build the interpreter library with the actual Apple SDKs.
      # They do not enable epix-ffi EVX or prove device isolation/lifecycle.
      - name: Check compiler-free Pulley device and simulator targets
        run: |
          cargo check -p evx-runtime --lib --locked --no-default-features --features pulley --target aarch64-apple-ios
          cargo check -p evx-runtime --lib --locked --no-default-features --features pulley --target aarch64-apple-ios-sim
      - name: Keep unsupported mobile product admission closed
        run: python3 scripts/check-evx-platforms.py ios-ffi android-ffi
