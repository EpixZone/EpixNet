name: Security scan

on:
  push:
    # edx: new EDX dependencies (blake3, bao-tree, snow, yamux, ...) must pass
    # the advisory/license gates on every branch push, not first at merge time.
    branches: [main, edx]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new advisories against pinned deps get caught even without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# No workflow-level permissions; each job requests only what it needs.
permissions: {}

jobs:
  cargo-audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Ignore the accepted advisories (see deny.toml / osv-scanner.toml for the
      # rationale). A failure here means a NEW advisory has appeared.
      - run: >-
          cargo audit
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2025-0141
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2024-0388
          --ignore RUSTSEC-2026-0387

  cargo-deny:
    name: cargo deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # Licenses are skipped for now: the workspace's own epix-* crates do
          # not declare a license field, which cargo-deny counts as unlicensed.
          # Add a compliance pass (workspace license) to re-enable it.
          command: check advisories bans sources

  osv-scanner:
    name: osv-scanner (Cargo.lock CVEs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test temporary OSV range correction
        run: python3 -m unittest discover -s scripts -p test_osv_ci_config.py
      - name: Prepare OSV policy for this lockfile
        run: python3 scripts/osv_ci_config.py
      - name: Scan Cargo.lock with OSV 2.7.0
        # The action wrapper converts exit 128 to success, even with the false
        # flag in scan-args. Call the same scanner directly to preserve errors.
        # Keep this restricted to the inventory checked by osv_ci_config.py.
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" --workdir /workspace \
            --entrypoint /root/osv-scanner \
            ghcr.io/google/osv-scanner-action:v2.7.0@sha256:d54770fe0b09493894e76a02aaed9f51a0513fa57c5186452a755d257b0068a6 \
            scan source --config=.osv-scanner-ci.toml --lockfile=Cargo.lock \
            --allow-no-lockfiles=false

  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # These audit-level rules are excluded because their advice is already
      # followed at every call site. nosemgrep comments don't help: a suppressed
      # finding stays in the SARIF and still surfaces as a code-scanning alert,
      # so the rule has to be dropped from the run instead.
      #  - args/args-os: flag EVERY read of the command line; we never trust
      #    argv[0] (all skip(1), none branch on the exe path).
      #  - unsafe-usage: flags EVERY `unsafe` block; iptproxy-sys is an FFI crate
      #    whose blocks are minimal calls into the Snowflake wrapper, each with a
      #    SAFETY comment (there is no way to bind the library without unsafe).
      #  - current-exe: iptproxy-sys calls current_exe() only to find the
      #    Snowflake library shipped beside the executable, not as a trust
      #    decision (an attacker who could write there could replace the exe).
      - run: >-
          semgrep scan
          --config p/rust --config p/security-audit --config p/secrets
          --exclude-rule rust.lang.security.args.args
          --exclude-rule rust.lang.security.args-os.args-os
          --exclude-rule rust.lang.security.unsafe-usage.unsafe-usage
          --exclude-rule rust.lang.security.current-exe.current-exe
          --error --sarif --output semgrep.sarif crates || true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: semgrep.sarif

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Run the gitleaks binary directly. The gitleaks-action requires a paid
      # license for GitHub organizations; the CLI itself is free (MIT).
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -sSfL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          sudo tar -xzf "$archive" -C /usr/local/bin gitleaks
      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose
