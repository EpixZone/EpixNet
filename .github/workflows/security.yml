name: Security scan

on:
  push:
    # edx: new EDX dependencies (blake3, bao-tree, snow, yamux, ...) must pass
    # the advisory/license gates on every branch push, not first at merge time.
    branches: [main, edx, evx]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new advisories against pinned deps get caught even without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# No workflow-level permissions; each job requests only what it needs.
permissions: {}

jobs:
  evx-fuzz:
    name: EVX boundary fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: nightly-2026-10-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
      - name: Install and fetch pinned fuzz dependencies
        id: fuzz-setup
        run: |
          python3 scripts/test-evx-fuzz-lock.py
          python3 scripts/test-evx-review-bundle.py
          cargo install cargo-fuzz --version 0.13.2 --locked
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
          python3 scripts/check-evx-fuzz-lock.py
          mkdir -p fuzz/results/ci
          sha256sum Cargo.lock fuzz/Cargo.lock > fuzz/results/ci/locks.sha256
          git rev-parse HEAD > fuzz/results/ci/revision.txt
          rustc --version --verbose > fuzz/results/ci/toolchain.txt
          cargo fuzz --version >> fuzz/results/ci/toolchain.txt
      - name: Exercise strict decoding and signed activation
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo fuzz run declaration --fuzz-dir fuzz --codegen-units 16 -- -runs=10000 -max_total_time=45 -timeout=5 -rss_limit_mb=768 -max_len=65536 2>&1 | tee fuzz/results/ci/declaration.log
          cargo fuzz run activation --fuzz-dir fuzz --codegen-units 16 -- -runs=10000 -max_total_time=45 -timeout=5 -rss_limit_mb=768 -max_len=65536 2>&1 | tee fuzz/results/ci/activation.log
      - name: Exercise the production Wasm profile validator
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fuzz run wasm_profile --fuzz-dir fuzz --features runtime --codegen-units 16 -- -runs=10000 -max_total_time=60 -timeout=5 -rss_limit_mb=1024 -max_len=1048576 2>&1 | tee fuzz/results/ci/wasm_profile.log
      - name: Exercise IPC framing and strict message decoding
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fuzz run ipc_frames --fuzz-dir fuzz --codegen-units 16 -- -runs=10000 -max_total_time=60 -timeout=5 -rss_limit_mb=1024 -max_len=262148 2>&1 | tee fuzz/results/ci/ipc_frames.log
      - name: Exercise durable state transitions
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fuzz run state_sequences --fuzz-dir fuzz --features state --codegen-units 16 -- -runs=10000 -max_total_time=60 -timeout=15 -rss_limit_mb=1024 -max_len=2048 2>&1 | tee fuzz/results/ci/state_sequences.log
      - name: Exercise host lifecycle metadata refusal and migration parsing
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fuzz run lifecycle_metadata --fuzz-dir fuzz --features lifecycle --codegen-units 16 --sanitizer address -- -runs=10000 -max_total_time=60 -timeout=10 -rss_limit_mb=1024 -max_len=65537 2>&1 | tee fuzz/results/ci/lifecycle_metadata.log
      - name: Verify fuzzing preserved both lockfiles
        if: always() && steps.fuzz-setup.outcome == 'success'
        run: sha256sum --check fuzz/results/ci/locks.sha256
      - name: Retain fuzz evidence and failure inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evx-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fuzz/results/ci/
            fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  cargo-audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Ignore the accepted advisories (see deny.toml / osv-scanner.toml for the
      # rationale). A failure here means a NEW advisory has appeared.
      - run: >-
          cargo audit
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2025-0141
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2024-0388

  cargo-deny:
    name: cargo deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # Licenses are skipped for now: the workspace's own epix-* crates do
          # not declare a license field, which cargo-deny counts as unlicensed.
          # Add a compliance pass (workspace license) to re-enable it.
          command: check advisories bans sources

  osv-scanner:
    name: osv-scanner (Cargo.lock CVEs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          # osv-scanner.toml holds the accepted-advisory ignore list.
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock

  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # These audit-level rules are excluded because their advice is already
      # followed at every call site. nosemgrep comments don't help: a suppressed
      # finding stays in the SARIF and still surfaces as a code-scanning alert,
      # so the rule has to be dropped from the run instead.
      #  - args/args-os: flag EVERY read of the command line; we never trust
      #    argv[0] (all skip(1), none branch on the exe path).
      #  - unsafe-usage: flags EVERY `unsafe` block; iptproxy-sys is an FFI crate
      #    whose blocks are minimal calls into the Snowflake wrapper, each with a
      #    SAFETY comment (there is no way to bind the library without unsafe).
      #  - current-exe: iptproxy-sys calls current_exe() only to find the
      #    Snowflake library shipped beside the executable, not as a trust
      #    decision (an attacker who could write there could replace the exe).
      - run: >-
          semgrep scan
          --config p/rust --config p/security-audit --config p/secrets
          --exclude-rule rust.lang.security.args.args
          --exclude-rule rust.lang.security.args-os.args-os
          --exclude-rule rust.lang.security.unsafe-usage.unsafe-usage
          --exclude-rule rust.lang.security.current-exe.current-exe
          --error --sarif --output semgrep.sarif crates || true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: semgrep.sarif

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Run the gitleaks binary directly. The gitleaks-action requires a paid
      # license for GitHub organizations; the CLI itself is free (MIT).
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -sSfL --retry 5 --retry-delay 2 --retry-max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          sudo tar -xzf "$archive" -C /usr/local/bin gitleaks
      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose
