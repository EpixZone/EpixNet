# Posts one-time warning comments on issues and PRs, such as scam warnings
# on wallet and seed phrase threads. Rules live in EpixZone/.github.
name: Warnings

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  warn:
    permissions:
      issues: write
      pull-requests: write
    uses: EpixZone/.github/.github/workflows/warnings.yml@main
