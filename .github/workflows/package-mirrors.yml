name: Package mirror compatibility

on:
  pull_request:
    paths:
      - 'crates/epix-mirror/**'
      - 'packaging/mirrors/**'
      - 'scripts/test-mirror-chocolatey.ps1'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/package-mirrors.yml'
  push:
    branches: [main]
    paths:
      - 'crates/epix-mirror/**'
      - 'packaging/mirrors/**'
      - 'scripts/test-mirror-chocolatey.ps1'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/package-mirrors.yml'

permissions: {}

jobs:
  snapshot-contracts:
    name: Snapshot safety (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: package-mirrors
      - run: cargo test -p epix-mirror --locked
      - run: cargo build -p epix-mirror --locked
      - name: Test Chocolatey in a private installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-mirror-chocolatey.ps1
