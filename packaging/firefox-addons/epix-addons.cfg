// EpixNet packaged extension guard. The first line is an AutoConfig comment.
(function () {
  var Cc = Components.classes, Ci = Components.interfaces;
  var prefs = Cc["@mozilla.org/preferences-service;1"].getService(Ci.nsIPrefService).getBranch("");
  var defaults = prefs.getDefaultBranch ? prefs.getDefaultBranch("") : Cc["@mozilla.org/preferences-service;1"].getService(Ci.nsIPrefService).getDefaultBranch("");
  var saved = ["xpinstall.enabled", "extensions.update.enabled"].map(function (name) {
    var value = { name: name, locked: prefs.prefIsLocked(name), defaultValue: defaults.getBoolPref(name, true) };
    lockPref(name, false);
    return value;
  });
  var manager;
  var guard = {
    onNewInstall: function (install) { install.cancel(); },
    onDownloadStarted: function (install) { install.cancel(); return false; },
    onDownloadEnded: function (install) { install.cancel(); return false; },
    onInstallStarted: function () { return false; }
  };
  try {
    manager = ChromeUtils.importESModule("resource://gre/modules/AddonManager.sys.mjs").AddonManager;
    manager.addInstallListener(guard);
    var io = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
    var directory = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties).get("GreD", Ci.nsIFile);
    directory.append("distribution"); directory.append("epix-addon-installer");
    io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler).setSubstitution("epix-addon-installer", io.newFileURI(directory));
    var manifest = directory.clone(); manifest.append("chrome.manifest");
    Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);
    // initialize installs the replacement guard synchronously. No await or event
    // loop is allowed between registering the conservative guard and this handoff.
    ChromeUtils.importESModule("resource://epix-addon-installer/manager.sys.mjs").initialize();
    manager.removeInstallListener(guard);
    for (var previous of saved) {
      prefs.unlockPref(previous.name);
      defaults.setBoolPref(previous.name, previous.defaultValue);
      if (previous.locked) prefs.lockPref(previous.name);
    }
  } catch (error) {
    // Keep the minimal guard and restrictions. Quitting here cannot prevent an
    // already staged update from activating, so no such guarantee is made.
    lockPref("xpinstall.enabled", false);
    lockPref("extensions.update.enabled", false);
    var observers = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
    observers.addObserver({ observe: function (window) {
      window.Services.prompt.alert(window,
        "Extension manager unavailable", "EpixNet could not load its trusted extension manager. Extension installs and updates are paused for this browser session. Close this browser and reopen it from EpixNet. If this continues, reinstall the current EpixNet release.");
    } }, "browser-delayed-startup-finished");
    Components.utils.reportError("EpixNet extension manager unavailable: " + String(error));
  }
})();
