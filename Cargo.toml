[workspace]
resolver = "2"
exclude = ["vendor/rln"]
members = ["crates/epix-core", "crates/epix-crypt", "crates/epix-db", "crates/epix-content", "crates/epix-transport", "crates/epix-protocol", "crates/epix-discovery", "crates/epix-xite", "crates/epix-worker", "crates/epix-ui", "crates/epix-server", "crates/epix-chain", "crates/epix-dht", "crates/epix-dht-net", "crates/epix-reticulum", "crates/epix-propagation", "crates/epix-runtime", "crates/epix-user", "crates/epix-peer", "crates/epix-plugin", "crates/epix-plugins", "crates/epix-tor", "crates/epix-i2p", "crates/epix-node", "crates/iptproxy-sys", "crates/epix-ffi", "crates/epix-browser", "crates/epix-nmh", "crates/epix-build", "crates/epix-bt", "crates/xid-spike", "crates/epix-blob", "crates/epix-fs", "crates/epix-selfenc", "crates/epix-edx", "crates/epix-feed", "crates/epix-search", "crates/epix-envelope", "crates/epix-channel", "crates/epix-pairwise-engine", "crates/epix-group-engine", "crates/epix-rln"]

# saturating-time 0.4.0 hangs forever on Windows: its platform-limit search
# assumes 1ns clock granularity, but Windows SystemTime is a 100ns FILETIME, so
# the loop never terminates. That made arti (tor-netdoc, tor-cert) hang on every
# Tor bootstrap on Windows. Point at our fork until the fix is released upstream.
# Fork: https://github.com/EpixZone/saturating-time  Upstream: https://codeberg.org/cve/saturating-time
[patch.crates-io]
saturating-time = { git = "https://github.com/EpixZone/saturating-time", rev = "afd652ed569053f878c30f6b0ef44528cd900d46" }
# Vendored rln (zerokit) with the sled-backed tree + C FFI gated off by default.
# Upstream rln pulls sled with the `compression` feature, which links native
# zstd and conflicts with arti's async-compression zstd (`links = "zstd"` may
# appear only once per build). We use only the stateless verifier, so the sled
# tree is opt-in behind the `stateful` feature and stays out of the node build.
# See vendor/rln for the exact (minimal, upstream-mergeable) patch.
rln = { path = "vendor/rln" }
